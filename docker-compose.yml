version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sales-db
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst123
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
      - ./queries:/queries
    restart: unless-stopped
